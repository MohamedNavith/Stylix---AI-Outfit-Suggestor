services:
  # 1. FastAPI Python Backend Service
  - type: web
    name: stylix-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false # Set this in the Render dashboard env settings
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 2. React Vite Frontend Static Site
  - type: web
    name: stylix-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        sync: false # Point this to your stylix-backend URL once deployed
