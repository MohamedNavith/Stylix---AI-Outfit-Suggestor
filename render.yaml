services:
  # 1. FastAPI Python Backend Service (Web Service)
  - type: web
    name: stylix-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        value: https://rrgglnwfdggbuwxwiqkz.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_dgK--KNZ9k0y1dlg58jqug_Shzbe-5Z
      - key: SUPABASE_KEY
        value: sb_publishable_dgK--KNZ9k0y1dlg58jqug_Shzbe-5Z
      - key: GEMINI_API_KEY
        sync: false # Set this in the Render dashboard for your AI Chatbot

  # 2. React Vite Frontend Static Site (Static Site)
  - type: web
    name: stylix-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: stylix-backend
          property: host
